name: Release macOS

# Construye el .dmg y el .app para macOS, firma los artefactos de
# auto-actualización con la clave minisign del proyecto y lo adjunta todo como
# borrador de GitHub Release en cada tag vX.Y.Z.
#
# SIN firma de código Apple ni notarización: el usuario verá el aviso de
# Gatekeeper (clic derecho → Abrir, o `xattr -cr` sobre el .app). Es una
# decisión consciente —ver dbv-specs-ops/docs/NATIVE_APPS_RELEASE_CI.md §8—,
# distinta de la firma minisign del updater, que sí está resuelta aquí.
#
# Secretos necesarios en el repositorio:
#   TAURI_SIGNING_PRIVATE_KEY           clave privada minisign (contenido, no ruta)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  su contraseña (cadena vacía si no tiene)
#
# Solo Apple Silicon (--target aarch64-apple-darwin), decisión consciente
# (2026-08-30): un build universal (universal-apple-darwin) necesita el
# sidecar Python compilado dos veces, una por arquitectura real — PyInstaller
# no compila cruzado, empaqueta el intérprete que lo ejecuta — y no hay forma
# de verificar aquí que las dependencias (torch) sigan publicando wheels de
# macOS Intel. Apple no vende Macs Intel desde 2023.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      draft:
        description: >
          "true" (normal): crea/usa un borrador para esa versión. "false": la Release de esa
          versión ya está PUBLICADA y solo quieres añadirle artefactos de esta plataforma.
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Leer versión de tauri.conf.json
        id: version
        run: echo "tag=v$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Determinar si la Release debe crearse/tratarse como borrador
        id: draft
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.draft }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar Rust (Apple Silicon)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-apple-darwin"

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Construir sidecar Python
        run: |
          python3 -m venv .venv-sidecar
          .venv-sidecar/bin/python -m pip install -r packaging/requirements-sidecar.txt
          .venv-sidecar/bin/python packaging/build_sidecar.py --target-triple aarch64-apple-darwin

      - name: Instalar dependencias de Node
        run: npm install

      - name: Build y Release (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma minisign de los artefactos de auto-actualización. Sin estas dos
          # variables el build FALLA (no las omite en silencio) porque
          # bundle.createUpdaterArtifacts está activo — ver
          # dbv-specs-ops/docs/NATIVE_APPS_RELEASE_CI.md §6.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target aarch64-apple-darwin
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: ${{ steps.version.outputs.tag }}
          releaseDraft: ${{ steps.draft.outputs.value }}
          prerelease: false
          includeUpdaterJson: true
