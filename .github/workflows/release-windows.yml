name: Release Windows

# Construye el instalador NSIS de Windows, firma los artefactos de
# auto-actualización con la clave minisign del proyecto y lo adjunta todo como
# borrador de GitHub Release en cada tag vX.Y.Z, junto con el latest.json que
# consume tauri-plugin-updater.
#
# SIN firma de código Authenticode: el usuario verá el aviso de SmartScreen
# ("Más información" → "Ejecutar de todas formas"). Es una decisión consciente
# —ver dbv-specs-ops/docs/NATIVE_APPS_RELEASE_CI.md §8—, distinta de la firma
# minisign del updater, que sí está resuelta aquí.
#
# Secretos necesarios en el repositorio:
#   TAURI_SIGNING_PRIVATE_KEY           clave privada minisign (contenido, no ruta)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  su contraseña (cadena vacía si no tiene)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      draft:
        description: >
          "true" (normal): crea/usa un borrador para esa versión. "false": la Release de esa
          versión ya está PUBLICADA y solo quieres añadirle artefactos de esta plataforma.
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Leer versión de tauri.conf.json
        id: version
        run: echo "tag=v$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$env:GITHUB_OUTPUT"

      - name: Determinar si la Release debe crearse/tratarse como borrador
        id: draft
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "value=${{ github.event.inputs.draft }}" >> $env:GITHUB_OUTPUT
          } else {
            "value=true" >> $env:GITHUB_OUTPUT
          }

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Construir sidecar Python
        shell: pwsh
        run: |
          python -m venv .venv-sidecar
          .\.venv-sidecar\Scripts\python.exe -m pip install -r packaging\requirements-sidecar.txt
          .\.venv-sidecar\Scripts\python.exe packaging\build_sidecar.py --target-triple x86_64-pc-windows-msvc

      - name: Instalar dependencias de Node
        run: npm install

      - name: Build y Release (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma minisign de los artefactos de auto-actualización. Sin estas dos
          # variables el build FALLA (no las omite en silencio) porque
          # bundle.createUpdaterArtifacts está activo — ver
          # dbv-specs-ops/docs/NATIVE_APPS_RELEASE_CI.md §6.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: ${{ steps.version.outputs.tag }}
          releaseDraft: ${{ steps.draft.outputs.value }}
          prerelease: false
          includeUpdaterJson: true
